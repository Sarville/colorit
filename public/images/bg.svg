<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fbfcfb"/>
      <stop offset="72%" stop-color="#eef6fb"/>
      <stop offset="100%" stop-color="#f8f2df"/>
    </radialGradient>

    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fdfff"/>
      <stop offset="100%" stop-color="#72c7ff"/>
    </linearGradient>
    <linearGradient id="mintStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f4ea"/>
      <stop offset="100%" stop-color="#a8ead9"/>
    </linearGradient>
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd7e6"/>
      <stop offset="100%" stop-color="#ffc1d9"/>
    </linearGradient>
    <linearGradient id="lilacStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4ddff"/>
      <stop offset="100%" stop-color="#d2ccff"/>
    </linearGradient>
    <linearGradient id="yellowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="100%" stop-color="#ffe99a"/>
    </linearGradient>
    <linearGradient id="cyanStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9fbff"/>
      <stop offset="100%" stop-color="#b7f0f8"/>
    </linearGradient>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="soften" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bgGlow)"/>

  <!-- subtle color haze -->
  <g opacity="0.32" filter="url(#softBlur)">
    <ellipse cx="470" cy="340" rx="620" ry="420" fill="#c9efff"/>
    <ellipse cx="3300" cy="310" rx="700" ry="380" fill="#fff0b8"/>
    <ellipse cx="510" cy="1820" rx="730" ry="460" fill="#ffd6ea"/>
    <ellipse cx="3150" cy="1790" rx="760" ry="430" fill="#d3f5e7"/>
    <ellipse cx="1950" cy="1960" rx="740" ry="280" fill="#dbe8ff"/>
  </g>

  <!-- painterly edge strokes -->
  <g filter="url(#soften)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- top left -->
    <path d="M -120 210 C 220 20, 580 40, 1010 170" stroke="url(#blueStroke)" stroke-width="220" opacity="0.38"/>
    <path d="M -80 350 C 210 180, 560 160, 860 250" stroke="url(#mintStroke)" stroke-width="170" opacity="0.30"/>
    <path d="M 20 90 C 300 10, 640 0, 1040 80" stroke="#a3dcff" stroke-width="120" opacity="0.22"/>

    <!-- top right -->
    <path d="M 2840 120 C 3210 10, 3490 30, 3920 180" stroke="url(#yellowStroke)" stroke-width="210" opacity="0.30"/>
    <path d="M 3050 270 C 3340 110, 3600 120, 3880 210" stroke="url(#pinkStroke)" stroke-width="155" opacity="0.26"/>
    <path d="M 3270 370 C 3490 300, 3680 270, 3890 240" stroke="url(#lilacStroke)" stroke-width="110" opacity="0.24"/>

    <!-- left side -->
    <path d="M -160 870 C 90 740, 350 760, 650 900" stroke="url(#yellowStroke)" stroke-width="185" opacity="0.22"/>
    <path d="M -150 1390 C 180 1310, 480 1440, 760 1580" stroke="url(#lilacStroke)" stroke-width="210" opacity="0.28"/>
    <path d="M -110 1870 C 240 1730, 600 1760, 1080 1880" stroke="url(#pinkStroke)" stroke-width="175" opacity="0.32"/>

    <!-- right side -->
    <path d="M 3200 1410 C 3460 1260, 3670 1210, 3960 1070" stroke="url(#cyanStroke)" stroke-width="175" opacity="0.30"/>
    <path d="M 2930 1770 C 3270 1580, 3550 1570, 3920 1660" stroke="url(#mintStroke)" stroke-width="205" opacity="0.25"/>
    <path d="M 3340 1960 C 3560 1850, 3720 1810, 3920 1750" stroke="url(#blueStroke)" stroke-width="170" opacity="0.22"/>

    <!-- bottom left -->
    <path d="M -90 2150 C 270 1940, 700 1930, 1350 2060" stroke="url(#yellowStroke)" stroke-width="200" opacity="0.26"/>
    <path d="M 120 1990 C 470 1900, 860 1920, 1320 1980" stroke="url(#pinkStroke)" stroke-width="150" opacity="0.28"/>
    <path d="M 1010 2020 C 1320 1970, 1620 1970, 2080 2080" stroke="url(#cyanStroke)" stroke-width="170" opacity="0.28"/>

    <!-- bottom right -->
    <path d="M 2520 2010 C 2880 1810, 3290 1810, 3840 1990" stroke="url(#mintStroke)" stroke-width="215" opacity="0.28"/>
    <path d="M 2920 1870 C 3260 1730, 3530 1710, 3880 1770" stroke="url(#blueStroke)" stroke-width="155" opacity="0.27"/>
  </g>

  <!-- dry-brush texture accents -->
  <g opacity="0.13" stroke-linecap="round" fill="none">
    <path d="M 70 135 L 260 80 L 520 92 L 800 160" stroke="#ffffff" stroke-width="22"/>
    <path d="M 3050 160 L 3360 120 L 3650 142" stroke="#ffffff" stroke-width="18"/>
    <path d="M 100 1510 L 420 1550 L 790 1630" stroke="#ffffff" stroke-width="18"/>
    <path d="M 2810 1770 L 3180 1710 L 3560 1750" stroke="#ffffff" stroke-width="20"/>
    <path d="M 1450 1990 L 1780 1970 L 2140 2035" stroke="#ffffff" stroke-width="18"/>
  </g>
</svg>
